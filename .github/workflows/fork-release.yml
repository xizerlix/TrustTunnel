name: Build custom release (fork)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. custom-1.0.0"
        required: true
        default: custom-1.0.0
      build:
        description: "Binaries to compile"
        type: choice
        options:
          - all
          - admin
        default: all
  push:
    tags:
      - "custom-*"

  # Tag push (custom-*) builds admin only. Full endpoint+admin:
  #   gh workflow run fork-release.yml -f tag=custom-x.y.z -f build=all

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build target
        id: target
        run: |
          TARGET="${{ github.event.inputs.build }}"
          if [ -z "$TARGET" ]; then TARGET="all"; fi
          echo "build=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Strip custom- prefix from version
        id: ver
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW#custom-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.target.outputs.build == 'all'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libclang-dev \
            perl \
            golang-go

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95 --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build all release binaries
        if: steps.target.outputs.build == 'all'
        env:
          TRUSTTUNNEL_VERSION: ${{ steps.ver.outputs.version }}
        run: cargo +1.95 build --bins --release

      - name: Build admin only
        if: steps.target.outputs.build == 'admin'
        env:
          TRUSTTUNNEL_VERSION: ${{ steps.ver.outputs.version }}
        run: cargo +1.95 build -p trusttunnel_admin --release --bin trusttunnel_admin

      - name: Package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUILD: ${{ steps.target.outputs.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          ARCH="linux-x86_64"
          NAME="trusttunnel-${TAG}-${ARCH}"
          mkdir -p "dist/${NAME}"
          if [ -f target/release/trusttunnel_endpoint ]; then
            cp target/release/trusttunnel_endpoint "dist/${NAME}/"
          elif [ "$BUILD" = "admin" ]; then
            gh release download "$TAG" --pattern "${NAME}.tar.gz" --dir /tmp || true
            if [ -f "/tmp/${NAME}.tar.gz" ]; then
              tar -xzf "/tmp/${NAME}.tar.gz" -C /tmp
              if [ -f "/tmp/${NAME}/trusttunnel_endpoint" ]; then
                cp "/tmp/${NAME}/trusttunnel_endpoint" "dist/${NAME}/"
              fi
            fi
          fi
          if [ -f target/release/trusttunnel_admin ]; then
            cp target/release/trusttunnel_admin "dist/${NAME}/"
          fi
          cp LICENSE "dist/${NAME}/"
          tar -czf "${NAME}.tar.gz" -C dist "${NAME}"
          echo "PACKAGE=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eux
          NOTES='Linux x86_64 fork of TrustTunnel v1.1.0: /clients (ips[], quotas), traffic_usage_file persistence, accept-rate / handshake limits, and the optional trusttunnel_admin web console.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "TrustTunnel ${TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" --title "TrustTunnel ${TAG}" --notes "$NOTES"
          fi
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" "$PACKAGE" --clobber; then
              exit 0
            fi
            echo "upload failed, retry ${i}/5"
            sleep $((i * 4))
          done
          exit 1
