name: Build custom release (fork)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. custom-1.0.0"
        required: true
        default: custom-1.0.0
  push:
    tags:
      - "custom-*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libclang-dev \
            perl \
            golang-go

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95 --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        env:
          TRUSTTUNNEL_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: cargo +1.95 build --bins --release

      - name: Package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eux
          ARCH="linux-x86_64"
          NAME="trusttunnel-${TAG}-${ARCH}"
          mkdir -p "dist/${NAME}"
          cp target/release/trusttunnel_endpoint "dist/${NAME}/"
          if [ -f target/release/trusttunnel_admin ]; then
            cp target/release/trusttunnel_admin "dist/${NAME}/"
          fi
          cp LICENSE "dist/${NAME}/"
          tar -czf "${NAME}.tar.gz" -C dist "${NAME}"
          echo "PACKAGE=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TrustTunnel ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Linux x86_64 fork of TrustTunnel v1.1.0: `/clients` (ips[], quotas),
            traffic_usage_file persistence, accept-rate / handshake limits,
            and the optional `trusttunnel_admin` web console.
          files: ${{ env.PACKAGE }}
          generate_release_notes: true
