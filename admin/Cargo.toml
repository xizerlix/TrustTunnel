[package]
name = "trusttunnel_admin"
version = "1.1.39"
edition = "2021"
authors = ["Nikolay Fedorenko"]
default-run = "trusttunnel_admin"

[[bin]]
name = "trusttunnel_admin"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "form", "query", "tokio", "http1", "json", "matched-path"] }
axum-extra = { version = "0.9", features = ["cookie"] }
base64 = "0.22"
bcrypt = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
data-encoding = "2"
form_urlencoded = "1.2"
futures = "0.3"
http = "1.1"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
subprocess = "0.2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.42", features = ["full"] }
toml = "0.8"
totp-lite = "2"
toml_edit = "0.22"
trusttunnel-deeplink = { path = "../deeplink" }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "trace", "set-header"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"