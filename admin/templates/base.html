<!doctype html>
<html lang="en" class="bg-slate-50 dark:bg-slate-900">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · TrustTunnel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <meta name="csrf-token" content="{{ csrf }}">
  <script>
    document.addEventListener('htmx:configRequest', (evt) => {
      evt.detail.headers['x-csrf-token'] = document.querySelector('meta[name="csrf-token"]')?.content || '';
    });
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="text-slate-900 dark:text-slate-100 min-h-screen flex">
  <aside class="w-56 bg-slate-100 dark:bg-slate-800 p-4 flex flex-col gap-2 border-r border-slate-200 dark:border-slate-700 overflow-visible">
    <h1 class="text-lg font-semibold mb-4 flex items-center gap-2 overflow-visible">
      <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center overflow-visible">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 overflow-visible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
        </svg>
      </span>
      <span class="leading-tight">TrustTunnel Admin</span>
    </h1>
    <a href="/dashboard" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700">Dashboard</a>
    <a href="/vpn" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700">VPN settings</a>
    <a href="/hosts" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700">TLS hosts</a>
    <a href="/users" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700">Users</a>
    <a href="/rules" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700">Rules</a>
    <a href="/logs" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700">Logs</a>
    <a href="/settings" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700">Settings</a>
    <div class="mt-auto pt-4 border-t border-slate-200 dark:border-slate-700">
      <div class="text-sm text-slate-500 mb-2">{{ username }}</div>
      <form method="post" action="/logout">
        <button type="submit" class="btn-ghost inline-block px-3 py-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700 w-full text-left">Logout</button>
      </form>
    </div>
  </aside>
  <main class="flex-1 p-8 max-w-5xl">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
