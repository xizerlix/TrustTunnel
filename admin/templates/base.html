<!doctype html>
<html lang="{{ lang }}" class="bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · TrustTunnel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <meta name="csrf-token" content="{{ csrf }}">
  <script>
    document.addEventListener('htmx:configRequest', (evt) => {
      evt.detail.headers['x-csrf-token'] = document.querySelector('meta[name="csrf-token"]')?.content || '';
    });
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    input:not([type=checkbox]):not([type=hidden]):not([type=radio]),
    select, textarea {
      border: 1px solid #cbd5e1;
      border-radius: 0.375rem;
      padding: 0.4rem 0.6rem;
      background: #fff;
      color: #0f172a;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #818cf8;
      outline-offset: 1px;
    }
    #save-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }
    #save-overlay.show { display: flex; }
    .spinner {
      width: 2.25rem;
      height: 2.25rem;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 9999px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-slate-900 min-h-screen flex">
  <aside class="w-56 shrink-0 bg-slate-100 p-4 flex flex-col gap-2 border-r border-slate-200 overflow-visible">
    <h1 class="text-lg font-semibold mb-4 flex items-center gap-2 overflow-visible leading-none">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6 shrink-0 text-indigo-500" aria-hidden="true">
        <path d="M12 2.5 5 5.6v5.6c0 4.7 3.1 8.8 7 10.3 3.9-1.5 7-5.6 7-10.3V5.6L12 2.5z"/>
      </svg>
      <span class="leading-tight">TrustTunnel Admin</span>
    </h1>
    <a href="/dashboard" class="px-3 py-2 rounded hover:bg-slate-200">{{ t.nav_dashboard }}</a>
    <a href="/vpn" class="px-3 py-2 rounded hover:bg-slate-200">{{ t.nav_vpn }}</a>
    <a href="/hosts" class="px-3 py-2 rounded hover:bg-slate-200">{{ t.nav_hosts }}</a>
    <a href="/users" class="px-3 py-2 rounded hover:bg-slate-200">{{ t.nav_users }}</a>
    <a href="/rules" class="px-3 py-2 rounded hover:bg-slate-200">{{ t.nav_rules }}</a>
    <a href="/logs" class="px-3 py-2 rounded hover:bg-slate-200">{{ t.nav_logs }}</a>
    <a href="/settings" class="px-3 py-2 rounded hover:bg-slate-200">{{ t.nav_settings }}</a>
    <div class="mt-auto pt-4 border-t border-slate-200 space-y-3">
      <div class="text-sm flex gap-2 px-3">
        <a href="/lang?set=en" class="underline {% if lang == "en" %}font-semibold{% endif %}">EN</a>
        <span class="text-slate-300">|</span>
        <a href="/lang?set=ru" class="underline {% if lang == "ru" %}font-semibold{% endif %}">RU</a>
      </div>
      <div class="text-sm text-slate-500 px-3">{{ username }}</div>
      <form method="post" action="/logout">
        <button type="submit" class="px-3 py-2 rounded hover:bg-slate-200 w-full text-left">{{ t.logout }}</button>
      </form>
    </div>
  </aside>
  <main class="flex-1 p-8 min-w-0">
    {% block body %}{% endblock %}
  </main>
  <div id="save-overlay">
    <div class="bg-white rounded-lg shadow-lg p-6 flex flex-col items-center gap-3">
      <div class="spinner"></div>
      <div class="text-sm text-slate-600">{{ t.saving }}</div>
    </div>
  </div>
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-slate-800 text-white text-sm px-4 py-2 rounded shadow-lg z-50"></div>
  <script>
    document.addEventListener('submit', function (e) {
      var f = e.target;
      if (f && f.matches && f.matches('form.js-save-wait')) {
        document.getElementById('save-overlay').classList.add('show');
      }
    });
    window.ttToast = function (msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(function () { el.classList.add('hidden'); }, 2500);
    };
  </script>
</body>
</html>
