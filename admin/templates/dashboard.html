{% extends "base.html" %}
{% block body %}
<h1 class="text-2xl sm:text-3xl font-semibold mb-6">{{ t.dashboard }}</h1>

<div id="dashboard-data">
{% include "dashboard_data.html" %}
</div>

<div id="ip-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <h2 id="ip-modal-title" class="font-semibold text-sm">{{ t.geo_title }}</h2>
      <button type="button" id="ip-modal-close" class="text-slate-500 text-sm">{{ t.close }}</button>
    </div>
    <div id="ip-modal-body" class="p-4 text-sm"></div>
  </div>
</div>

<div id="dest-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <h2 id="dest-modal-title" class="font-semibold text-sm">{{ t.dest_title }}</h2>
      <button type="button" id="dest-modal-close" class="text-slate-500 text-sm">{{ t.close }}</button>
    </div>
    <div class="flex flex-wrap gap-1 px-4 pt-3" id="dest-periods">
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="today">{{ t.dest_today }}</button>
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="week">{{ t.dest_week }}</button>
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="month">{{ t.dest_month }}</button>
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="all">{{ t.dest_all }}</button>
    </div>
    <p class="px-4 pt-2 text-xs text-slate-500">{{ t.dest_hint }}</p>
    <div id="dest-modal-body" class="p-4 text-sm overflow-y-auto max-h-80"></div>
  </div>
</div>

<div id="dash-i18n" class="hidden"
     data-reboot-confirm="{{ t.reboot_confirm }}"
     data-geo-loading="{{ t.geo_loading }}"
     data-geo-error="{{ t.geo_error }}"
     data-geo-private="{{ t.geo_private }}"
     data-dest-title="{{ t.dest_title }}"
     data-dest-loading="{{ t.dest_loading }}"
     data-dest-error="{{ t.dest_error }}"
     data-dest-empty="{{ t.dest_empty }}"
     data-lock-allow="{{ t.lock_allow }}"
     data-lock-block="{{ t.lock_block }}"
     data-lock-error="{{ t.lock_error }}"></div>

<script>
(function () {
  var root = document.getElementById('dashboard-data');
  if (!root) return;
  var i18n = document.getElementById('dash-i18n');
  var modal = document.getElementById('ip-modal');
  var modalBody = document.getElementById('ip-modal-body');
  var modalTitle = document.getElementById('ip-modal-title');
  var destModal = document.getElementById('dest-modal');
  var destBody = document.getElementById('dest-modal-body');
  var destTitle = document.getElementById('dest-modal-title');
  var destUser = '';
  var destPeriod = 'today';
  function csrf() {
    return document.querySelector('meta[name="csrf-token"]')?.content || '';
  }
  function tick() {
    fetch('/dashboard/data', { credentials: 'same-origin', redirect: 'manual' })
      .then(function (r) {
        if (r.status === 401 || r.status === 302 || r.status === 303 || r.type === 'opaqueredirect') {
          window.location.href = '/login';
          return null;
        }
        if (!r.ok) return null;
        return r.text();
      })
      .then(function (html) {
        if (html) root.innerHTML = html;
      })
      .catch(function () {});
  }
  setInterval(tick, 5000);

  function postOp(url) {
    return fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'x-csrf-token': csrf() }
    }).then(function (r) { return r.json().catch(function () { return {}; }); });
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var restart = t.closest('.js-svc-restart');
    if (restart) {
      restart.disabled = true;
      postOp('/dashboard/service').then(function (j) {
        if (j && j.message) alert(j.message);
        tick();
      }).catch(function () {}).then(function () { restart.disabled = false; });
      return;
    }
    var reboot = t.closest('.js-host-reboot');
    if (reboot) {
      if (!confirm(i18n.getAttribute('data-reboot-confirm'))) return;
      reboot.disabled = true;
      postOp('/dashboard/reboot').then(function (j) {
        if (j && j.message) alert(j.message);
      }).catch(function () {}).then(function () { reboot.disabled = false; });
      return;
    }
    var ipBtn = t.closest('.js-ip');
    if (ipBtn) {
      var ip = ipBtn.getAttribute('data-ip') || '';
      openIp(ip);
      return;
    }
    var lockBtn = t.closest('.js-lock');
    if (lockBtn) {
      var user = lockBtn.getAttribute('data-user') || '';
      if (!user || lockBtn.disabled) return;
      lockBtn.disabled = true;
      fetch('/dashboard/user/lock?user=' + encodeURIComponent(user), {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'x-csrf-token': csrf() }
      }).then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (j) {
          if (!j || !j.ok) {
            alert((j && j.message) || i18n.getAttribute('data-lock-error'));
            return;
          }
          setLockState(lockBtn, !!j.disabled);
          tick();
        }).catch(function () {
          alert(i18n.getAttribute('data-lock-error'));
        }).then(function () { lockBtn.disabled = false; });
      return;
    }
    var userBtn = t.closest('.js-user');
    if (userBtn) {
      openDest(userBtn.getAttribute('data-user') || '', destPeriod);
      return;
    }
    var periodBtn = t.closest('.js-dest-period');
    if (periodBtn && destUser) {
      openDest(destUser, periodBtn.getAttribute('data-period') || 'today');
    }
  });

  function openIp(ip) {
    destModal.classList.add('hidden');
    modal.classList.remove('hidden');
    modalTitle.textContent = ip;
    modalBody.textContent = i18n.getAttribute('data-geo-loading');
    fetch('/dashboard/ip?ip=' + encodeURIComponent(ip), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.ok === false) {
          modalBody.textContent = i18n.getAttribute('data-geo-error');
          return;
        }
        var html = '';
        if (d.map_url) {
          html += '<iframe class="w-full h-44 rounded mb-3 border-0" src="' + d.map_url + '"></iframe>';
        } else {
          html += '<p class="text-slate-500 mb-2">' + i18n.getAttribute('data-geo-private') + '</p>';
        }
        function row(k, v) {
          if (!v) return;
          html += '<div class="flex gap-2 py-0.5"><span class="text-slate-500 w-24 shrink-0">' + k + '</span><span class="break-all">' + v + '</span></div>';
        }
        row('IP', d.query || ip);
        row('kind', d.kind);
        row('country', d.country);
        row('region', d.region);
        row('city', d.city);
        row('zip', d.zip);
        row('ISP', d.isp);
        row('org', d.org);
        row('AS', d.asn);
        row('tz', d.timezone);
        if (d.lat != null && d.lon != null) row('lat/lon', d.lat + ', ' + d.lon);
        var flags = [];
        if (d.mobile) flags.push('mobile');
        if (d.proxy) flags.push('proxy');
        if (d.hosting) flags.push('hosting');
        if (flags.length) row('flags', flags.join(', '));
        modalBody.innerHTML = html;
      })
      .catch(function () {
        modalBody.textContent = i18n.getAttribute('data-geo-error');
      });
  }

  function setLockState(btn, disabled) {
    btn.setAttribute('data-disabled', disabled ? 'true' : 'false');
    btn.setAttribute('title', disabled
      ? i18n.getAttribute('data-lock-allow')
      : i18n.getAttribute('data-lock-block'));
    var openIcon = btn.querySelector('.js-lock-open');
    var closedIcon = btn.querySelector('.js-lock-closed');
    if (openIcon) openIcon.classList.toggle('hidden', disabled);
    if (closedIcon) closedIcon.classList.toggle('hidden', !disabled);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function markPeriod(period) {
    var buttons = document.querySelectorAll('.js-dest-period');
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute('data-period') === period) {
        buttons[i].classList.add('is-on');
      } else {
        buttons[i].classList.remove('is-on');
      }
    }
  }

  function openDest(user, period) {
    destUser = user;
    destPeriod = period || 'today';
    modal.classList.add('hidden');
    destModal.classList.remove('hidden');
    destTitle.textContent = user || i18n.getAttribute('data-dest-title');
    destBody.textContent = i18n.getAttribute('data-dest-loading');
    markPeriod(destPeriod);
    fetch('/dashboard/user?user=' + encodeURIComponent(user) + '&period=' + encodeURIComponent(destPeriod), {
      credentials: 'same-origin'
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.ok === false) {
          destBody.textContent = i18n.getAttribute('data-dest-error');
          return;
        }
        var rows = d.rows || [];
        if (!rows.length) {
          destBody.textContent = i18n.getAttribute('data-dest-empty');
          return;
        }
        var max = 1;
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].count > max) max = rows[i].count;
        }
        var html = '';
        for (var j = 0; j < rows.length; j++) {
          var pct = Math.max(4, Math.round((rows[j].count / max) * 100));
          html += '<div class="mb-2">';
          html += '<div class="flex justify-between gap-2 text-xs mb-0.5">';
          html += '<span class="font-medium break-all">' + escapeHtml(rows[j].host) + '</span>';
          html += '<span class="text-slate-500 shrink-0">' + rows[j].count + '</span>';
          html += '</div>';
          html += '<div class="w-full h-2 bg-slate-200 rounded overflow-hidden">';
          html += '<div class="h-full bg-indigo-500" style="width:' + pct + '%"></div>';
          html += '</div></div>';
        }
        destBody.innerHTML = html;
      })
      .catch(function () {
        destBody.textContent = i18n.getAttribute('data-dest-error');
      });
  }

  document.getElementById('ip-modal-close').addEventListener('click', function () {
    modal.classList.add('hidden');
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.classList.add('hidden');
  });
  document.getElementById('dest-modal-close').addEventListener('click', function () {
    destModal.classList.add('hidden');
  });
  destModal.addEventListener('click', function (e) {
    if (e.target === destModal) destModal.classList.add('hidden');
  });
})();
</script>
{% endblock %}
