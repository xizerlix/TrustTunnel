{% extends "base.html" %}
{% block body %}
<h1 class="text-xl sm:text-2xl font-semibold mb-3">{{ t.dashboard }}</h1>

<div id="dashboard-data">
{% include "dashboard_data.html" %}
</div>

<div id="ip-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <h2 id="ip-modal-title" class="font-semibold text-sm">{{ t.geo_title }}</h2>
      <button type="button" id="ip-modal-close" class="text-slate-500 text-sm">{{ t.close }}</button>
    </div>
    <div id="ip-modal-body" class="p-4 text-sm"></div>
  </div>
</div>

<div id="dest-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <h2 id="dest-modal-title" class="font-semibold text-sm">{{ t.dest_title }}</h2>
      <button type="button" id="dest-modal-close" class="text-slate-500 text-sm">{{ t.close }}</button>
    </div>
    <div class="flex flex-wrap gap-1 px-4 pt-3" id="dest-periods">
      <button type="button" class="js-dest-period is-on px-2 py-1 text-xs rounded bg-slate-100" data-period="hour">{{ t.dest_hour }}</button>
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="today">{{ t.dest_today }}</button>
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="week">{{ t.dest_week }}</button>
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="month">{{ t.dest_month }}</button>
      <button type="button" class="js-dest-period px-2 py-1 text-xs rounded bg-slate-100" data-period="all">{{ t.dest_all }}</button>
    </div>
    <p class="px-4 pt-2 text-xs text-slate-500">{{ t.dest_hint }}</p>
    <div id="dest-modal-body" class="p-4 text-sm overflow-y-auto max-h-80"></div>
  </div>
</div>

<div id="chart-help-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <h2 class="font-semibold text-sm">{{ t.chart_help_title }}</h2>
      <button type="button" id="chart-help-close" class="text-slate-500 text-sm">{{ t.close }}</button>
    </div>
    <div class="chart-help-body p-4 text-sm text-slate-700">{{ t.chart_help }}</div>
  </div>
</div>

<div id="dash-i18n" class="hidden"
     data-reboot-confirm="{{ t.reboot_confirm }}"
     data-geo-loading="{{ t.geo_loading }}"
     data-geo-error="{{ t.geo_error }}"
     data-geo-private="{{ t.geo_private }}"
     data-dest-title="{{ t.dest_title }}"
     data-dest-loading="{{ t.dest_loading }}"
     data-dest-error="{{ t.dest_error }}"
     data-dest-empty="{{ t.dest_empty }}"
     data-traf-empty="{{ t.traf_empty }}"
     data-lock-allow="{{ t.lock_allow }}"
     data-lock-block="{{ t.lock_block }}"
     data-lock-error="{{ t.lock_error }}"></div>
<div id="traf-tip" class="traf-tip hidden"></div>

<script>
(function () {
  var root = document.getElementById('dashboard-data');
  if (!root) return;
  var i18n = document.getElementById('dash-i18n');
  var modal = document.getElementById('ip-modal');
  var modalBody = document.getElementById('ip-modal-body');
  var modalTitle = document.getElementById('ip-modal-title');
  var destModal = document.getElementById('dest-modal');
  var destBody = document.getElementById('dest-modal-body');
  var destTitle = document.getElementById('dest-modal-title');
    var destUser = null;
    var destPeriod = 'hour';
    var destReq = 0;
    var trafPeriod = 'hour';
    var lastTrafKey = '';
    var trafReq = 0;
  function csrf() {
    return document.querySelector('meta[name="csrf-token"]')?.content || '';
  }
  function tick() {
    fetch('/dashboard/data', { credentials: 'same-origin', redirect: 'manual' })
      .then(function (r) {
        if (r.status === 401 || r.status === 302 || r.status === 303 || r.type === 'opaqueredirect') {
          window.location.href = '/login';
          return null;
        }
        if (!r.ok) return null;
        return r.text();
      })
      .then(function (html) {
        if (!html) return;
        var ids = ['cpu-chart', 'ram-chart', 'io-chart', 'traf-chart'];
        var saved = {};
        for (var i = 0; i < ids.length; i++) {
          var n = document.getElementById(ids[i]);
          saved[ids[i]] = n ? n.innerHTML.replace(/is-pick/g, '') : '';
        }
        root.innerHTML = html;
        for (var j = 0; j < ids.length; j++) {
          var el = document.getElementById(ids[j]);
          if (el && saved[ids[j]]) el.innerHTML = saved[ids[j]];
        }
        markTrafPeriod();
      })
      .catch(function () {});
  }
  setInterval(tick, 5000);

  function postOp(url) {
    return fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'x-csrf-token': csrf() }
    }).then(function (r) { return r.json().catch(function () { return {}; }); });
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var restart = t.closest('.js-svc-restart');
    if (restart) {
      restart.disabled = true;
      postOp('/dashboard/service').then(function (j) {
        if (j && j.message) alert(j.message);
        tick();
      }).catch(function () {}).then(function () { restart.disabled = false; });
      return;
    }
    var reboot = t.closest('.js-host-reboot');
    if (reboot) {
      if (!confirm(i18n.getAttribute('data-reboot-confirm'))) return;
      reboot.disabled = true;
      postOp('/dashboard/reboot').then(function (j) {
        if (j && j.message) alert(j.message);
      }).catch(function () {}).then(function () { reboot.disabled = false; });
      return;
    }
    var ipBtn = t.closest('.js-ip');
    if (ipBtn) {
      var ip = ipBtn.getAttribute('data-ip') || '';
      openIp(ip);
      return;
    }
    var lockBtn = t.closest('.js-lock');
    if (lockBtn) {
      var user = lockBtn.getAttribute('data-user') || '';
      if (!user || lockBtn.disabled) return;
      lockBtn.disabled = true;
      fetch('/dashboard/user/lock?user=' + encodeURIComponent(user), {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'x-csrf-token': csrf() }
      }).then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (j) {
          if (!j || !j.ok) {
            alert((j && j.message) || i18n.getAttribute('data-lock-error'));
            return;
          }
          setLockState(lockBtn, !!j.disabled);
        }).catch(function () {
          alert(i18n.getAttribute('data-lock-error'));
        }).then(function () { lockBtn.disabled = false; });
      return;
    }
    var userBtn = t.closest('.js-user');
    if (userBtn) {
      openDest(userBtn.getAttribute('data-user') || '', destPeriod);
      return;
    }
    var allDest = t.closest('.js-dest-all');
    if (allDest) {
      openDest('', destPeriod);
      return;
    }
    var trafBtn = t.closest('.js-traf-period');
    if (trafBtn) {
      trafPeriod = trafBtn.getAttribute('data-period') || 'hour';
      markTrafPeriod();
      loadTraf();
      return;
    }
    var periodBtn = t.closest('.js-dest-period');
    if (periodBtn && destUser !== null) {
      openDest(destUser, periodBtn.getAttribute('data-period') || 'hour');
      return;
    }
    var infoBtn = t.closest('.js-chart-info');
    if (infoBtn) {
      var help = document.getElementById('chart-help-modal');
      if (help) help.classList.remove('hidden');
      return;
    }
  });

  function openIp(ip) {
    destModal.classList.add('hidden');
    modal.classList.remove('hidden');
    modalTitle.textContent = ip;
    modalBody.textContent = i18n.getAttribute('data-geo-loading');
    fetch('/dashboard/ip?ip=' + encodeURIComponent(ip), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.ok === false) {
          modalBody.textContent = i18n.getAttribute('data-geo-error');
          return;
        }
        var html = '';
        if (d.map_url) {
          html += '<iframe class="w-full h-44 rounded mb-3 border-0" src="' + d.map_url + '"></iframe>';
        } else {
          html += '<p class="text-slate-500 mb-2">' + i18n.getAttribute('data-geo-private') + '</p>';
        }
        function row(k, v) {
          if (!v) return;
          html += '<div class="flex gap-2 py-0.5"><span class="text-slate-500 w-24 shrink-0">' + k + '</span><span class="break-all">' + v + '</span></div>';
        }
        row('IP', d.query || ip);
        row('kind', d.kind);
        row('country', d.country);
        row('region', d.region);
        row('city', d.city);
        row('zip', d.zip);
        row('ISP', d.isp);
        row('org', d.org);
        row('AS', d.asn);
        row('tz', d.timezone);
        if (d.lat != null && d.lon != null) row('lat/lon', d.lat + ', ' + d.lon);
        var flags = [];
        if (d.mobile) flags.push('mobile');
        if (d.proxy) flags.push('proxy');
        if (d.hosting) flags.push('hosting');
        if (flags.length) row('flags', flags.join(', '));
        modalBody.innerHTML = html;
      })
      .catch(function () {
        modalBody.textContent = i18n.getAttribute('data-geo-error');
      });
  }

  function setLockState(btn, disabled) {
    var label = disabled
      ? i18n.getAttribute('data-lock-allow')
      : i18n.getAttribute('data-lock-block');
    btn.setAttribute('data-disabled', disabled ? 'true' : 'false');
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
    btn.style.color = disabled ? '#e11d48' : '#4f46e5';
    var openIcon = btn.querySelector('.js-lock-open');
    var closedIcon = btn.querySelector('.js-lock-closed');
    if (openIcon) openIcon.style.display = disabled ? 'none' : 'block';
    if (closedIcon) closedIcon.style.display = disabled ? 'block' : 'none';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function markPeriod(period) {
    var buttons = document.querySelectorAll('.js-dest-period');
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute('data-period') === period) {
        buttons[i].classList.add('is-on');
      } else {
        buttons[i].classList.remove('is-on');
      }
    }
  }

  function openDest(user, period) {
    var sameCard = !destModal.classList.contains('hidden') && destBody.innerHTML;
    destUser = user;
    destPeriod = period || 'hour';
    destReq += 1;
    var req = destReq;
    modal.classList.add('hidden');
    destModal.classList.remove('hidden');
    destTitle.textContent = user ? user : i18n.getAttribute('data-dest-title');
    markPeriod(destPeriod);
    if (!sameCard || !destBody.innerHTML) {
      destBody.textContent = i18n.getAttribute('data-dest-loading');
    } else {
      destBody.style.minHeight = destBody.offsetHeight + 'px';
    }
    fetch('/dashboard/user?user=' + encodeURIComponent(user) + '&period=' + encodeURIComponent(destPeriod), {
      credentials: 'same-origin'
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (req !== destReq) return;
        if (!d || d.ok === false) {
          destBody.textContent = i18n.getAttribute('data-dest-error');
          destBody.style.minHeight = '';
          return;
        }
        var rows = d.rows || [];
        if (!rows.length) {
          destBody.textContent = i18n.getAttribute('data-dest-empty');
          destBody.style.minHeight = '';
          return;
        }
        var max = 1;
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].count > max) max = rows[i].count;
        }
        var html = '';
        for (var j = 0; j < rows.length; j++) {
          var pct = Math.max(4, Math.round((rows[j].count / max) * 100));
          html += '<div class="mb-2">';
          html += '<div class="flex justify-between gap-2 text-xs mb-0.5">';
          html += '<span class="font-medium break-all">' + escapeHtml(rows[j].host) + '</span>';
          html += '<span class="text-slate-500 shrink-0">' + rows[j].count + '</span>';
          html += '</div>';
          html += '<div class="w-full h-2 bg-slate-200 rounded overflow-hidden">';
          html += '<div class="h-full bg-indigo-500" style="width:' + pct + '%"></div>';
          html += '</div></div>';
        }
        destBody.innerHTML = html;
        destBody.style.minHeight = '';
      })
      .catch(function () {
        if (req !== destReq) return;
        destBody.textContent = i18n.getAttribute('data-dest-error');
        destBody.style.minHeight = '';
      });
  }

  function markTrafPeriod() {
    var buttons = document.querySelectorAll('.js-traf-period');
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute('data-period') === trafPeriod) {
        buttons[i].classList.add('is-on');
      } else {
        buttons[i].classList.remove('is-on');
      }
    }
  }

  function loadTraf() {
    var period = trafPeriod;
    trafReq += 1;
    var req = trafReq;
    fetch('/dashboard/traffic?period=' + encodeURIComponent(period), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (req !== trafReq) return;
        if (!d || !d.ok) return;
        var key = period + ':' + JSON.stringify(d);
        var chart = document.getElementById('traf-chart');
        if (key === lastTrafKey && chart && chart.innerHTML) return;
        lastTrafKey = key;
        drawTraf(document.getElementById('cpu-chart'), d.cpu || [], period, '#f59e0b', 'pct');
        drawTraf(document.getElementById('ram-chart'), d.ram || [], period, '#10b981', 'pct');
        drawTraf(document.getElementById('io-chart'), d.io || [], period, '#8b5cf6', 'bytes');
        drawTraf(document.getElementById('traf-chart'), d.traffic || d.points || [], period, '#6366f1', 'bytes');
      })
      .catch(function () {});
  }

  function fmtTrafBytes(n) {
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var v = n;
    var i = 0;
    while (v >= 1024 && i < units.length - 1) {
      v /= 1024;
      i++;
    }
    if (i === 0) return n + ' B';
    return v.toFixed(2) + ' ' + units[i];
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function fmtTrafTime(ts, period) {
    var d = new Date(ts * 1000);
    var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    if (period === 'week') {
      var endw = new Date((ts + 15 * 60) * 1000);
      var range = hm + '–' + pad2(endw.getHours()) + ':' + pad2(endw.getMinutes());
      try {
        return d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + range;
      } catch (e) {
        return range;
      }
    }
    if (period === 'day') {
      var end = new Date((ts + 5 * 60) * 1000);
      return hm + '–' + pad2(end.getHours()) + ':' + pad2(end.getMinutes());
    }
    return hm + ':' + pad2(d.getSeconds());
  }

  function trafAxisLabels(period) {
    if (period === 'day') return ['0h', '6h', '12h', '18h', '24h'];
    if (period === 'week') return ['0d', '2d', '4d', '6d', '7d'];
    return ['0', '15', '30', '45', '60'];
  }

  function ptVal(p) {
    if (!p) return 0;
    if (p.v != null) return p.v;
    return p.bytes || 0;
  }

  function fmtPctMilli(n) {
    return (n / 1000).toFixed(1) + ' %';
  }

  function drawTraf(el, points, period, color, kind) {
    if (!el) return;
    if (!points.length) {
      el.innerHTML = '<p class="traf-empty">' + escapeHtml(i18n.getAttribute('data-traf-empty') || '') + '</p><div class="traf-readout">&nbsp;</div>';
      return;
    }
    var w = 360;
    var h = 52;
    var padL = 1;
    var padR = 1;
    var padT = 3;
    var padB = 1;
    var max = kind === 'pct' ? 100000 : 1;
    var j;
    if (kind !== 'pct') {
      for (j = 0; j < points.length; j++) {
        var pv = ptVal(points[j]);
        if (pv > max) max = pv;
      }
    }
    var inner = w - padL - padR;
    var bw = inner / points.length;
    var plotH = h - padT - padB;
    var html = '<div class="traf-plot" data-vb="' + w + '" data-pad="' + padL + '" data-bw="' + bw + '"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" class="traf-svg">';
    var hits = '';
    for (j = 0; j < points.length; j++) {
      var x = padL + j * bw;
      var rw = Math.max(0.6, bw - 0.35);
      var val = ptVal(points[j]);
      if (val > 0) {
        var bh = Math.max(1.2, (val / max) * plotH);
        if (bh > plotH) bh = plotH;
        var y = padT + plotH - bh;
        html += '<rect class="traf-bar" x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + rw.toFixed(2) + '" height="' + bh.toFixed(2) + '" fill="' + color + '" rx="0.6"/>';
      }
      var shown = kind === 'pct' ? fmtPctMilli(val) : fmtTrafBytes(val);
      var tip = fmtTrafTime(points[j].t, period) + ' · ' + shown;
      hits += '<rect class="traf-hit" data-tip="' + escapeHtml(tip) + '" data-bx="' + x.toFixed(2) + '" data-bw="' + rw.toFixed(2) + '" x="' + x.toFixed(2) + '" y="0" width="' + bw.toFixed(2) + '" height="' + h + '" fill="transparent"/>';
    }
    var last = points[points.length - 1];
    var latestTip = fmtTrafTime(last.t, period) + ' · ' + (kind === 'pct' ? fmtPctMilli(ptVal(last)) : fmtTrafBytes(ptVal(last)));
    html += '<rect class="traf-sel" x="0" y="0" width="0" height="' + h + '" fill="#0f172a" fill-opacity="0.35"/>';
    html += hits + '</svg></div>';
    html += '<div class="traf-readout" data-latest="' + escapeHtml(latestTip) + '">' + escapeHtml(latestTip) + '</div><div class="traf-axis">';
    var labels = trafAxisLabels(period);
    for (var k = 0; k < labels.length; k++) {
      html += '<span>' + labels[k] + '</span>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  var trafTip = document.getElementById('traf-tip');
  var activePlot = null;
  function readoutOf(plot) {
    return plot.parentElement && plot.parentElement.querySelector('.traf-readout');
  }
  function pickChart(plot, clientX) {
    if (!plot) return;
    if (activePlot && activePlot !== plot) hideChartPick(activePlot);
    activePlot = plot;
    var hits = plot.querySelectorAll('.traf-hit');
    if (!hits.length) return;
    var svg = plot.querySelector('svg') || plot;
    var rect = svg.getBoundingClientRect();
    var vb = parseFloat(plot.getAttribute('data-vb') || '360');
    var pad = parseFloat(plot.getAttribute('data-pad') || '0');
    var bw = parseFloat(plot.getAttribute('data-bw') || '1');
    var svgX = rect.width > 0 ? ((clientX - rect.left) / rect.width) * vb : 0;
    var i = Math.floor((svgX - pad) / bw);
    i = Math.max(0, Math.min(hits.length - 1, i));
    var hit = hits[i];
    var tip = hit.getAttribute('data-tip') || '';
    var readout = readoutOf(plot);
    if (readout) readout.textContent = tip;
    var sel = plot.querySelector('.traf-sel');
    if (sel) {
      sel.setAttribute('x', hit.getAttribute('data-bx') || '0');
      sel.setAttribute('width', hit.getAttribute('data-bw') || '1');
    }
    plot.classList.add('is-pick');
    if (trafTip) trafTip.classList.add('hidden');
  }
  function hideChartPick(plot) {
    if (!plot) return;
    plot.classList.remove('is-pick');
    var sel = plot.querySelector('.traf-sel');
    if (sel) sel.setAttribute('width', '0');
    var readout = readoutOf(plot);
    if (readout) readout.textContent = readout.getAttribute('data-latest') || readout.textContent;
    if (activePlot === plot) activePlot = null;
    if (trafTip) trafTip.classList.add('hidden');
  }
  document.addEventListener('pointermove', function (e) {
    var plot = e.target && e.target.closest && e.target.closest('.traf-plot');
    if (plot) {
      pickChart(plot, e.clientX);
      return;
    }
    if (activePlot) hideChartPick(activePlot);
  });
  document.addEventListener('pointerdown', function (e) {
    var plot = e.target && e.target.closest && e.target.closest('.traf-plot');
    if (plot) pickChart(plot, e.clientX);
  });
  document.addEventListener('pointerup', function (e) {
    if (e.pointerType === 'mouse') return;
    if (activePlot) hideChartPick(activePlot);
  });
  document.addEventListener('pointercancel', function () {
    if (activePlot) hideChartPick(activePlot);
  });

  markTrafPeriod();
  loadTraf();
  setInterval(loadTraf, 20000);

  document.getElementById('ip-modal-close').addEventListener('click', function () {
    modal.classList.add('hidden');
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.classList.add('hidden');
  });
  document.getElementById('dest-modal-close').addEventListener('click', function () {
    destModal.classList.add('hidden');
  });
  destModal.addEventListener('click', function (e) {
    if (e.target === destModal) destModal.classList.add('hidden');
  });
  var chartHelp = document.getElementById('chart-help-modal');
  var chartHelpClose = document.getElementById('chart-help-close');
  if (chartHelpClose) {
    chartHelpClose.addEventListener('click', function () {
      chartHelp.classList.add('hidden');
    });
  }
  if (chartHelp) {
    chartHelp.addEventListener('click', function (e) {
      if (e.target === chartHelp) chartHelp.classList.add('hidden');
    });
  }
})();
</script>
{% endblock %}
