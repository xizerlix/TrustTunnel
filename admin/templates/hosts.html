{% extends "base.html" %}
{% block body %}
<h1 class="text-3xl font-semibold mb-6">{{ t.tls_hosts }}</h1>

{% if let Some(s) = save_status %}
  <div class="bg-emerald-100 text-emerald-800 p-3 rounded mb-4">{{ s }}</div>
{% endif %}
{% if let Some(e) = error %}
  <div class="bg-rose-100 text-rose-800 p-3 rounded mb-4">{{ e }}</div>
{% endif %}

<form method="post" action="/hosts" class="space-y-6 js-save-wait"><input type="hidden" name="csrf" value="{{ csrf }}">
  <fieldset class="bg-white p-6 rounded shadow">
    <legend class="text-lg font-semibold px-2">{{ t.tls_hosts }}</legend>
    <div class="space-y-6">
      {% for h in hosts.main_hosts %}
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-b border-slate-100 pb-6">
        <label class="block">
          <span class="block text-sm font-medium mb-1">{{ t.hostname }}</span>
          <input type="text" name="main_hostname" value="{{ h.hostname }}" required>
        </label>
        <label class="block">
          <span class="block text-sm font-medium mb-1">{{ t.cert_path }}</span>
          <input type="text" name="main_cert" value="{{ h.cert_chain_path }}" required>
        </label>
        <label class="block">
          <span class="block text-sm font-medium mb-1">{{ t.key_path }}</span>
          <input type="text" name="main_key" value="{{ h.private_key_path }}" required>
        </label>
        <label class="block md:col-span-2">
          <span class="block text-sm font-medium mb-1">{{ t.allowed_sni }}</span>
          <textarea name="main_allowed_sni" rows="3">{{ h.sni_text() }}</textarea>
          <p class="text-xs text-slate-500 mt-1">{{ t.sni_help }}</p>
        </label>
      </div>
      {% endfor %}
    </div>
  </fieldset>

  <div class="flex justify-end">
    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded font-medium hover:bg-indigo-700">
      {{ t.save_reload }}
    </button>
  </div>
</form>
{% endblock %}
