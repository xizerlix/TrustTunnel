<!doctype html>
<html lang="{{ lang }}" class="bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.sign_in }} · TrustTunnel Admin</title>
  <link rel="stylesheet" href="/static/admin.css?v=hostcharts8">
</head>
<body class="min-h-screen flex items-center justify-center">
  <form method="post" action="/login" class="bg-white p-8 rounded-lg shadow-md w-96 space-y-4">
    <h1 class="text-2xl font-semibold text-center">{{ t.sign_in }}</h1>
    {% if let Some(e) = error %}
      <div class="bg-rose-100 text-rose-800 p-3 rounded text-sm">{{ e }}</div>
    {% endif %}
    <label class="block">
      <span class="block text-sm font-medium mb-1">{{ t.username }}</span>
      <input type="text" name="username" value="{{ username }}" required autofocus>
    </label>
    <label class="block">
      <span class="block text-sm font-medium mb-1">{{ t.password }}</span>
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded font-medium hover:bg-indigo-700">{{ t.sign_in }}</button>
    <div class="text-center text-sm text-slate-500">
      <a href="/lang?set=en&next=/login" class="{% if lang == "en" %}font-semibold{% endif %}">EN</a>
      ·
      <a href="/lang?set=ru&next=/login" class="{% if lang == "ru" %}font-semibold{% endif %}">RU</a>
    </div>
  </form>
</body>
</html>
