<!doctype html>
<html lang="en" class="bg-slate-50 dark:bg-slate-900">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Service Diagnostics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <form method="post" action="/login" class="bg-white dark:bg-slate-800 p-8 rounded-lg shadow-md w-96 space-y-4">
    <h1 class="text-2xl font-semibold text-center">Sign in</h1>
    {% if let Some(e) = error %}
      <div class="bg-rose-100 dark:bg-rose-900 text-rose-800 dark:text-rose-200 p-3 rounded text-sm">{{ e }}</div>
    {% endif %}
    <label class="block">
      <span class="block text-sm font-medium mb-1">Username</span>
      <input type="text" name="username" value="{{ username }}" required autofocus
             class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900">
    </label>
    <label class="block">
      <span class="block text-sm font-medium mb-1">Password</span>
      <input type="password" name="password" required
             class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900">
    </label>
    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded font-medium hover:bg-indigo-700">Sign in</button>
  </form>
</body>
</html>
