{% extends "base.html" %}
{% block body %}
<h1 class="text-3xl font-semibold mb-6">{{ t.logs }}</h1>

<div class="flex gap-2 mb-4">
  <a href="/logs" class="px-3 py-2 rounded {% if tab == "logs" %}bg-indigo-600 text-white{% else %}bg-white border border-slate-300{% endif %}">{{ t.tab_service }}</a>
  <a href="/logs/htop" class="px-3 py-2 rounded {% if tab == "htop" %}bg-indigo-600 text-white{% else %}bg-white border border-slate-300{% endif %}">{{ t.tab_htop }}</a>
</div>

{% if tab == "logs" %}
<form method="get" action="/logs" class="mb-4 flex flex-wrap gap-4 items-end">
  <label class="block">
    <span class="block text-sm font-medium mb-1">{{ t.lines }}</span>
    <input type="number" min="50" max="5000" name="lines" value="{{ lines }}">
  </label>
  <label class="block">
    <span class="block text-sm font-medium mb-1">{{ t.auto_refresh }}</span>
    <select name="refresh">
      <option value="off" {% if refresh == "off" %}selected{% endif %}>off</option>
      <option value="3" {% if refresh == "3" %}selected{% endif %}>3s</option>
      <option value="10" {% if refresh == "10" %}selected{% endif %}>10s</option>
      <option value="30" {% if refresh == "30" %}selected{% endif %}>30s</option>
    </select>
  </label>
  <label class="flex items-center gap-2 pb-2">
    <input type="checkbox" name="system" value="on" {% if system %}checked{% endif %}>
    <span class="text-sm">{{ t.system_logs }}</span>
  </label>
  <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded font-medium hover:bg-indigo-700">{{ t.refresh }}</button>
</form>
{% endif %}

{% if let Some(e) = error %}
  <div class="bg-rose-100 text-rose-800 p-3 rounded mb-4">{{ e }}</div>
{% endif %}

{% if refresh != "off" %}
<script>
  setTimeout(function () { location.reload(); }, {{ refresh }}000);
</script>
{% endif %}

<pre class="bg-white text-slate-800 border border-slate-200 p-4 rounded text-xs overflow-auto font-mono whitespace-pre-wrap break-all min-h-[70vh] w-full max-w-full">{{ content }}</pre>
{% endblock %}
